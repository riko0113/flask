<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kids.css') }}" />
    
    <!-- 💡 キャッシュ対策およびdetectorライクなヘッダーレイアウトのインライン強制 -->
    <style>
        .dt-container {
            width: 100%;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;    
            justify-content: flex-start;
        }
        .dt-search-header-row {
            width: 100% !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 15px !important;
            margin-bottom: 25px !important;
        }
        .dt-search-form-flex {
            flex: 1 !important;
        }
        .dt-top-profile-container {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            margin: 0 !important;
        }
    </style>
</head>
<body>
    <!-- 親コンテナで全体をセンタリングラップ -->
    <div class="dt-container">
        
        {% if request.endpoint in ['kids.index', 'kids.search'] %}
        <!-- 💡 検索バーとアイコンを横並びにするヘッダー行 -->
        <div class="dt-content-width dt-search-header-row">
            <form method="GET" action="{{ url_for('kids.search') }}" name="dtSearchForm" class="dt-search-form-flex" style="margin: 0;">
                <div class="search-group">
                    <input 
                      type="search"
                      id="dt-search"
                      class="dt-search"
                      placeholder="キーワードで検索..."
                      name="search"
                      value="{{ request.args.get('search', '') }}"
                    />
                    <button type="submit" class="dt-search-btn">🔍</button>
                </div>
            </form>
            
            <!-- 右端にアイコンを密着並び -->
            <div class="dt-top-profile-container">
                <a href="{{ url_for('kids.account', user_id=current_user.id) }}" class="dt-top-profile-link">
                    <span class="dt-top-profile-icon">{{ current_user.username[:1].upper() }}</span>
                </a>
            </div>
        </div>
        {% endif %}
        
        <!-- メインコンテンツ -->
        {% block content %}{% endblock %}
    </div>
</body>
</html>
