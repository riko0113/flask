{% extends "kids/base.html" %}
{% block title %}kids{% endblock %}
{% block content %}
<h3>kidsのみんな</h3>

<div class="col-md-10 text-right dt-image-register-btn">
    <a href="{{ url_for('kids.upload_image') }}" class="btn btn-primary">
        画像新規登録
    </a>
</div>

{% for user, image in user_images %}
<div class="card col-md-7 dt-image-content">

    <header class="d-flex justify-content-between">
        <div class="dt-image-username">
            {{ user.username }}
        </div>
    </header>

    <section>
        <img
            src="{{ url_for('kids.image_file', filename=image.image_path) }}"
            alt="アップロード画像"
            class="img-fluid"
        >
    </section>

    <div class="card-body">
        <p><strong>ジャンル：</strong>{{ image.genre }}</p>
        <p><strong>コメント：</strong>{{ image.comment }}</p>
    </div>

</div>
{% endfor %}

{% endblock %}
