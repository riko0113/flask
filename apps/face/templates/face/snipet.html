<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <script>
      const DETECTOR_URL = "{{ url_for('detector.index') }}";
    </script>
    <script defer src="{{ url_for('face.static', filename='face-api.min.js') }}"></script>
    <script defer src="{{ url_for('face.static', filename='script.js') }}"></script>
    <style>
/* ==========================================
    🌌 グローバルサイバーネイビー背景 & 全体設定
   ========================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
}

body {
    background-color: #020617;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    gap: 24px;
    background-image: 
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
}

/* 🤖 顔認証ページ専用 */
.face {
    max-width: 800px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(15, 23, 42, 0.65);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid rgba(56, 189, 248, 0.2);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.1);
    backdrop-filter: blur(12px);
    box-sizing: border-box;
    gap: 24px;
}

.title h1 {
    font-size: 32px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 3px;
    text-align: center;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
}

/* 🎥 ビデオ枠 */
.video-wrapper {
    position: relative;
    padding: 2px;
    background: linear-gradient(135deg, #06b6d4, #6366f1);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
}

/* カメラ映像（ここで鏡写しに反転） */
#video {
    display: block;
    background-color: #020617;
    border-radius: 10px;
    max-width: 100%;
    height: auto;
    transform: scaleX(-1); /* 💡 カメラ映像だけを反転 */
}

/* 🎯 分析シート */
canvas {
    position: absolute !important;
    top: 2px !important;
    left: 2px !important;
    width: calc(100% - 4px) !important;
    height: calc(100% - 4px) !important;
    z-index: 10 !important;
    pointer-events: none;
}

/* スキャンアニメーション */
.video-wrapper::after {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, transparent, #38bdf8, #ffffff, #38bdf8, transparent);
    box-shadow: 0 0 15px #38bdf8; animation: scan 3s linear infinite;
    z-index: 5;
}
@keyframes scan {
    0% { top: 0%; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { top: 100%; opacity: 0; }
}

.face > a {
    display: block;
    width: 100%;
    max-width: 200px;
    text-align: center;
    padding: 12px 20px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(148, 163, 184, 0.4);
    color: #94a3b8;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.face > a:hover {
    background: rgba(56, 189, 248, 0.1);
    color: #38bdf8;
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    transform: translateY(-2px);
}
    </style>
  </head>
  <body>
  <div class="container">
    <div class="face">
      <div class="title">
        <h1>顔認証ページ</h1>
      </div>
            
      <div class="video-wrapper">
        <video id="video" width="720" height="560" autoplay muted></video>
      </div>

    </div> 
  </div>
</body>
</html>
