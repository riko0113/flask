<!DOCTYPE html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <script>
      const DETECTOR_URL = "{{ url_for('detector.index') }}";
    </script>
    <script defer src="{{ url_for('face.static', filename='face-api.min.js') }}"></script>
    <script defer src="{{ url_for('face.static', filename='script.js') }}"></script>
    <style>
        /* 1. 画面全体の背景をダークモードにして、要素を画面のド真ん中に寄せる */
body {
  margin: 0;
  padding: 0;
  background-color: #1a1a1a; /* カッコいいダークグレー */
  color: #ffffff;            /* 文字は白 */
  font-family: 'Helvetica Neue', Arial, sans-serif;
  
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;        /* 画面の縦幅いっぱいに広げる */
}

/* 2. 全体を囲むコンテナ（少し未来的な枠線をつける） */
.face {
  display: flex;
  flex-direction: column;   /* 中身（タイトルとビデオ）を縦に並べる */
  align-items: center;      /* 縦に並べたものを中央に寄せる */
  background-color: #2a2a2a;/* ビデオの背景になる少し明るいグレー */
  padding: 30px;
  border-radius: 16px;      /* 角を丸くする */
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); /* ふわっと浮き出る影 */
}

/* 3. タイトルのデザイン */
.title h1 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 24px;
  letter-spacing: 2px;      /* 文字の間隔を少し広げてスタイリッシュに */
  text-align: center;
}

/* 4. ビデオ（カメラ映像）のデザイン */
#video {
  background-color: #000;   /* カメラが起動する前の黒画面 */
  border-radius: 8px;       /* ビデオの角も少し丸くする */
  box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
  
  /* スマホなどの画面からはみ出さないための保険 */
  max-width: 100%;
  height: auto;
}
    </style>
  </head>
  <body>
  <div class="container">
    <div class="face">
      <div class="title">
        <h1>顔認証ページ</h1>
      </div>
      <a href="{{ url_for('crud.edit_user', user_id=current_user.id) }}" >
          編集
      </a>
      <video id="video" width="720" height="560" autoplay muted></video>
    </div> 
  </div>
</body>
</html>
