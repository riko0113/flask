{% extends "detector/base.html" %}
{% block content %}

<a href="{{ url_for('crud.edit_user', user_id=current_user.id, model='adult') }}" >
    登録情報の編集
</a>
<div class="dt-user-posts-header">
    <h2>{{ selected_user.username }} さんの投稿一覧</h2>
    <a href="{{ url_for('detector.index') }}" class="btn-back">一覧に戻る</a>
</div>

{% for user, image in user_images %}
<div class ="card col-md-7 image-content-between">
    <header class ="d-flex justify-content-">
        <div class ="dt-image-username">{{ user.username }}</div>
    </header>
    
    <section>
        <img src = "{{ url_for('detector.image_file', filename = image.image_path) }}"
             alt = "アップロード画像"
        />
        <p>ジャンル：{{ image.genre }}</p>
        <p>コメント：{{ image.comment }}</p>
    </section>
</div>
{% else %}
    <p class="no-posts">まだ投稿がありません。</p>
{% endfor %}

{% endblock %}
