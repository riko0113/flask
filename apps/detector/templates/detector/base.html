<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detector.css') }}" />
</head>
<body>
    <div class="dt-container">
        
        <!-- 💡 検索バーを一番上に単独で1行配置（これで絶対にはみ出さない） -->
        {% if request.endpoint in ['detector.index', 'detector.search'] %}
        <div class="dt-content-width dt-search-top-zone">
            <form method="GET" action="{{url_for('detector.search')}}" name="dtSearchForm" style="width: 100%;">
                <div class="search-group">
                    <input 
                      type="search"
                      id="dt-search"
                      class="dt-search"
                      placeholder="キーワードで検索..."
                      name="search"
                      value="{{ request.args.get('search', '') }}"
                    />
                    <button type="submit" class="dt-search-btn">🔍</button>
                </div>
            </form>
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
