<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detector.css') }}" />
</head>
<body>
    <div class="dt-container">
        
        <!-- 💡 検索バーとプロフィールを同じ一行の中に配置 -->
        {% if request.endpoint in ['detector.index', 'detector.search'] %}
        <div class="dt-content-width dt-header-search-row">
            <form method="GET" action="{{url_for('detector.search')}}" name="dtSearchForm" class="dt-search-form-flex">
                <div class="search-group">
                    <input 
                      type="search"
                      id="dt-search"
                      class="dt-search"
                      placeholder="キーワードで検索..."
                      name="search"
                      value="{{ request.args.get('search', '') }}"
                    />
                    <button type="submit" class="dt-search-btn">🔍</button>
                </div>
            </form>
            
            <!-- 💡 検索ボタンのすぐ横にプロフィールアイコンを設置 -->
            <div class="dt-top-profile-container">
                <a href="{{ url_for('detector.account', user_id=current_user.id) }}" class="dt-top-profile-link" title="マイページへ">
                    <span class="dt-top-profile-icon">{{ current_user.username[:1].upper() }}</span>
                </a>
            </div>
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
